name: Build and release AWS images
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    environment: aws
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [patient, appointment, insurance, notification, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B verify
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SERVICE: ${{ matrix.service }}
        run: |
          folder="springboot-${SERVICE}-service"
          if [ "$SERVICE" = gateway ]; then folder=springcloud-api-gateway; fi
          docker build -f "$folder/Dockerfile" -t "$REGISTRY/careconnect-$SERVICE:$GITHUB_SHA" .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/careconnect-${{ matrix.service }}:${{ github.sha }}
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Push immutable image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/careconnect-${{ matrix.service }}:${{ github.sha }}
        run: docker push "$IMAGE"
